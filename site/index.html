<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degree Completion Guides</title>

    <link rel="stylesheet" href="css/base.css">
</head>
<body onload="scaleToFit()">
    <div class="page">
        <header class="page-header">
            <div class="title-container">
                <div class="header-logo">
                    <img src="assets/svgs/ivy-logo.svg">
                </div>
                <div class="header-title">
                    <div class="course-name">
                        <h1 id="title-first-words">DEGREE NAME GOES</h1>
                        <span class="keep-together">
                            <span id="title-last-word">HERE</span>
                            <span class="rounded-line"></span>
                            <span id="degree-type">DEGREE TYPE</span>
                        </span>
                    </div>
                    <h2>Completion Guide</h2>
                </div>
            </div>
            <div class="icon-legend">
                <div class="legend-group">
                    <img class="badge" src="assets/svgs/Requirment.svg" alt="">
                    <p class="legend-required">Required for that Semester</p>
                </div>
                <div class="legend-group">
                    <img class="badge" src="assets/svgs/Elective.svg" alt="">
                    <p class="legend-elective">Elective</p>
                </div>
                <div class="legend-group">
                    <img class="badge" src="assets/svgs/Gen_ed.svg" alt="">
                    <p class="legend-general">General Education</p>
                </div>
            </div>
        </header>
        <div class="page-content" id="page-content">
            <div class="footer" id="footer">Some courses may be offered at various times or course modality. Please speak to your advisor for those options.</div>
        </div>
    </div>
    <script src="scripts/scaleToFit.js",></script>
</body>
</html>
